name: Maven Build
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: economyexpandnk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build plugin
        run: mvn -B -ntp clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EconomyExpandNK
          path: target/EconomyExpandNK-*.jar