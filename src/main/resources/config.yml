language: es
default-currency: crystals

# H2 integrado: no requiere instalar ni configurar un servidor de base de datos.
# La base se crea automáticamente dentro de plugins/EconomyExpandNK/.
# Supported: h2 | mysql | sqlite | mongodb | yaml
storage:
  type: h2
  sql:
    sqlite-file: wallets.db
    h2-file: wallets-h2
    mysql:
      host: 127.0.0.1
      port: 3306
      database: economyexpand
      username: root
      password: ""
      use-ssl: false
  mongodb:
    uri: mongodb://127.0.0.1:27017
    database: economyexpand
    collection: wallets
