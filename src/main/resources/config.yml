language: es
default-currency: crystals

# MySQL local por defecto.
# En instalaciones locales tipo XAMPP/WAMP suele usarse root sin contraseña.
# Si tu MySQL tiene otra credencial, cambia username y password.
# Supported: mysql | sqlite | h2 | mongodb | yaml
storage:
  type: mysql
  sql:
    sqlite-file: wallets.db
    h2-file: wallets-h2
    mysql:
      host: 127.0.0.1
      port: 3306
      database: economyexpand
      username: root
      password: ""
      use-ssl: false
  mongodb:
    uri: mongodb://127.0.0.1:27017
    database: economyexpand
    collection: wallets
